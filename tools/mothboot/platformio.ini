; MothBoot 0.1.2. Factory-slot launcher for the M5Stack Cardputer ADV.
; It does not build the synth. Apps are linked separately and written
; into ota_0 or ota_1.

[platformio]
src_dir = src
include_dir = include

[env:mothboot]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = ../../partitions/mothboot_8MB.csv
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_build.f_flash = 80000000L
board_build.sdkconfig_options =
  CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y
monitor_speed = 115200
upload_speed = 921600
extra_scripts = pre:extra_script.py
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0
  -I../../include
lib_deps =
  m5stack/M5Unified@0.2.25
  m5stack/M5GFX@0.2.32
  m5stack/M5Cardputer@1.1.1
lib_ignore =
  IRremote
