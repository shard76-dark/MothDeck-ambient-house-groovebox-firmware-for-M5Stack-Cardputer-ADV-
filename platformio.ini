; MothDeck for the M5Stack Cardputer ADV, plus a LilyGO TTGO T8 V1.8 target.
; cardputer-adv-dev is the Cardputer firmware with serial logs. The Cardputer
; board id is esp32-s3-devkitc-1 because PlatformIO has no Stamp-S3A entry;
; the pins in include/BoardConfig.h are the ADV. ttgo-t8 is a classic
; ESP32-WROVER. Wiring is in docs/TTGO-T8.md.
; memory_type matches Arduino-ESP32's m5stack_cardputer board (boot qio,
; psram qspi, PSRAM left off) and Launcher's Cardputer environment.
; qio_opi would boot-init octal PSRAM on the display pins. This module has
; no PSRAM; psramFound() falls back to internal RAM if a chip is ever present.
; NimBLE pool sizes (connections, mbufs, roles) are compiled into the
; prebuilt Arduino libbt.a. board_build flags cannot shrink them.

[platformio]
src_dir = src
include_dir = include

[env:cardputer-adv]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = partitions/cardputer_adv_8MB.csv
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_build.f_flash = 80000000L
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  m5stack/M5Unified@0.2.25
  m5stack/M5GFX@0.2.32
  m5stack/M5Cardputer@1.1.1
lib_ignore =
  IRremote

; Same firmware with SD and speaker logs on the USB serial port.
; CORE_DEBUG_LEVEL=1 keeps Arduino log_e (nimble_port_init failures) and
; leaves the info/debug flood off. BLE state is printed by the firmware
; itself on both envs. USB CDC is on from boot, same as cardputer-adv.
[env:cardputer-adv-dev]
extends = env:cardputer-adv
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
  -DMOTHOS_DEV_LOG=1

; LilyGO TTGO T8 V1.8 (ESP32-WROVER, 4MB flash, 4MB PSRAM). Headless by
; default: PCM5102A I2S, serial keys, loops in PSRAM beside NimBLE.
; ttgo-t8-dac is the same image with the internal DAC on GPIO25.
; -DMOTHDECK_HAS_TFT=1 adds the optional ST7789. See docs/TTGO-T8.md.
[env:ttgo-t8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp-wrover-kit
framework = arduino
board_build.partitions = partitions/ttgo_t8_4MB.csv
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_build.f_flash = 80000000L
monitor_speed = 115200
upload_speed = 460800
build_flags =
  -DMOTHDECK_BOARD_TTGO=1
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  m5stack/M5GFX@0.2.32
lib_ignore =
  IRremote
  M5Unified
  M5Cardputer

[env:ttgo-t8-dac]
extends = env:ttgo-t8
build_flags =
  -DMOTHDECK_BOARD_TTGO=1
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=0
  -DMOTHDECK_INTERNAL_DAC=1
