; MothDeck — M5Stack Cardputer ADV (ESP32-S3, 8MB flash, octal PSRAM).
; Pins, codec, and display belong to the board. Nothing is wired off-board.

[platformio]
src_dir = src
include_dir = include

[env:cardputer-adv]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = partitions/cardputer_adv_8MB.csv
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  m5stack/M5Unified@0.2.25
  m5stack/M5GFX@0.2.32
  m5stack/M5Cardputer@1.1.1
lib_ignore =
  IRremote

; Same firmware with SD and speaker logs on the USB serial port.
[env:cardputer-adv-dev]
extends = env:cardputer-adv
build_flags =
  ${env:cardputer-adv.build_flags}
  -DMOTHOS_DEV_LOG=1
