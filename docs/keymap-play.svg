<rect x="787" y="588" width="81" height="26" rx="5" fill="#c44784"/>
<text x="795" y="605" fill="#fff5fa" font-size="12">This page</text>
<rect x="876" y="588" width="74" height="26" rx="5" fill="#1a6a82"/>
<text x="884" y="605" fill="#e8f7fb" font-size="12">Fn layer</text>
<rect x="958" y="588" width="74" height="26" rx="5" fill="#4c5562"/>
<text x="966" y="605" fill="#eef2f6" font-size="12">Modifier</text>
<rect x="1040" y="588" width="81" height="26" rx="5" fill="#262b32"/>
<text x="1048" y="605" fill="#8b939c" font-size="12">No action</text>
<text x="28" y="630" fill="#c5ccd3" font-size="13">Bottom letters are the current octave. Q through ] is the next octave, chromatic. Comma is the C above that row.</text>
<text x="28" y="650" fill="#c5ccd3" font-size="13">Shift or Alt adds an octave on letter notes. Opt subtracts one. They stack and clamp to MIDI C2–B5.</text>
<text x="28" y="670" fill="#c5ccd3" font-size="13">Fn+; and Fn+. change page only while the page list is open. Fn+, and Fn+/ do nothing on Play. Other Fn chords</text>
<text x="28" y="690" fill="#c5ccd3" font-size="13">still do the key's normal action.</text>
<text x="28" y="710" fill="#c5ccd3" font-size="13">Fn+− and Fn+= change speaker volume on every page (step 12). Hold ` or the front button about 0.7s to exit.</text>
<text x="28" y="730" fill="#c5ccd3" font-size="13">While the page list is open it takes every key. Fn+; , Fn+. , and Tab move the highlight. Enter stays there. `</text>
<text x="28" y="750" fill="#c5ccd3" font-size="13">or Backspace returns to Play. Notes, space, and track keys do nothing.</text>
<text x="28" y="770" fill="#c5ccd3" font-size="13">; sends note-length L with the stored length, and does not step it. The voice stores 4 minus that value. Enter</text>
<text x="28" y="790" fill="#c5ccd3" font-size="13">does nothing on Play.</text>
<text x="28" y="810" fill="#c5ccd3" font-size="13">Ctrl or Shift sends the shifted glyph, then the UI lowercases it. Digits and punctuation no longer match, so</text>
<text x="28" y="830" fill="#c5ccd3" font-size="13">Ctrl+1–8 (!@#$%^&amp;*) does not clear a track or pattern, and Shift+, is &lt; rather than high C. Ctrl+N still starts</text>
<text x="28" y="850" fill="#c5ccd3" font-size="13">a new song.</text>
</svg>
